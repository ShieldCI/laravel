name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 9 (PHP 8.1–8.2) — uses phpunit9.xml; no coverage (PHPUnit 9 incompatible with <source>)
          - php: '8.1'
            laravel: '9.*'
            testbench: '^7.0'
            phpunit-config: phpunit9.xml
          - php: '8.2'
            laravel: '9.*'
            testbench: '^7.0'
            phpunit-config: phpunit9.xml
          # Laravel 10 (PHP 8.1–8.3)
          - php: '8.1'
            laravel: '10.*'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '10.*'
            testbench: '^8.0'
          - php: '8.3'
            laravel: '10.*'
            testbench: '^8.0'
          # Laravel 11 (PHP 8.2–8.4)
          - php: '8.2'
            laravel: '11.*'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '11.*'
            testbench: '^9.0'
          - php: '8.4'
            laravel: '11.*'
            testbench: '^9.0'
          # Laravel 12 (PHP 8.2–8.5)
          - php: '8.2'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '12.*'
            testbench: '^10.0'
          # Laravel 13 (PHP 8.3–8.5). illuminate/http only accepts Guzzle 8 from
          # v13.26.0, so these are the only rows where either major can be chosen
          # deliberately. Pin one row to each so neither stops being exercised.
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
            guzzle: '^7.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            guzzle: '^8.0'
          - php: '8.5'
            laravel: '13.*'
            testbench: '^11.0'
            guzzle: '^8.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.guzzle && format(' / Guzzle {0}', matrix.guzzle) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, dom, curl, libxml, zip, pcntl
          coverage: ${{ matrix.phpunit-config && 'none' || 'xdebug' }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          if [ -n "${{ matrix.guzzle }}" ]; then
            composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-update
          fi
          composer update --prefer-dist --no-interaction --no-progress

      - name: Report resolved Guzzle version
        run: composer show | grep '^guzzlehttp/'

      - name: Run tests
        run: vendor/bin/phpunit ${{ matrix.phpunit-config && format('--configuration {0} --no-coverage', matrix.phpunit-config) || '--coverage-clover=coverage.xml' }}

      - name: Upload coverage to Codecov
        if: ${{ !matrix.phpunit-config }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.3.2
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-phpstan-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-pint-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-pint-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check code style
        run: vendor/bin/pint --test
